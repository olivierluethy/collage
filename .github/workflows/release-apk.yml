name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/collage-release.jks
            {
              echo "storeFile=collage-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Release signing configured (stable key)."
          else
            echo "No keystore secret set — falling back to debug signing."
          fi

      - name: Build split-per-abi release APKs
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
          --dart-define=AI_PROXY_URL=${{ secrets.AI_PROXY_URL }}
          --dart-define=FONT_CATALOG_URL=${{ secrets.FONT_CATALOG_URL }}
          --dart-define=STICKER_CATALOG_URL=${{ secrets.STICKER_CATALOG_URL }}

      - name: Build universal release APK
        run: >
          flutter build apk --release
          --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
          --dart-define=AI_PROXY_URL=${{ secrets.AI_PROXY_URL }}
          --dart-define=FONT_CATALOG_URL=${{ secrets.FONT_CATALOG_URL }}
          --dart-define=STICKER_CATALOG_URL=${{ secrets.STICKER_CATALOG_URL }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/*.apk
